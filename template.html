<title>Posted — Monday Ads Review</title>
<style>
:root{
  --surface-0:#f4f5f6; --surface-1:#ffffff; --surface-2:#eceef0; --surface-3:#e4e6e9;
  --line:#e7e9ec; --line-soft:#eef0f2;
  --text-primary:#18181b; --text-secondary:#52525b; --text-tertiary:#8a8f98;
  --ps-yellow:#ffd100; --accent-strong:#c99700; --accent-soft:#fff7d6; --accent-line:#e6b400;
  --positive:#16a34a; --positive-soft:#e7f5ec; --negative:#dc2626; --negative-soft:#fbeaea;
  --warning:#c77900; --warning-soft:#fdf1dd; --neutral:#8a8f98;
  --ink-line:#18181b; --yellow-line:#e0a800;
  --shadow:0 1px 2px rgba(24,24,27,.04), 0 4px 16px rgba(24,24,27,.05);
  --shadow-lift:0 2px 6px rgba(24,24,27,.07), 0 10px 28px rgba(24,24,27,.09);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface-0:#0a0a0a; --surface-1:#151516; --surface-2:#1f1f21; --surface-3:#2a2a2d;
  --line:#242427; --line-soft:#1b1b1d;
  --text-primary:#f2f2f2; --text-secondary:#a3a3a3; --text-tertiary:#6b6b6b;
  --accent-strong:#ffd100; --accent-soft:#26220a; --accent-line:#ffd100;
  --positive:#22c55e; --positive-soft:#123021; --negative:#ef4444; --negative-soft:#331717;
  --warning:#f59e0b; --warning-soft:#2a1f08;
  --ink-line:#f2f2f2; --yellow-line:#ffd100; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lift:0 6px 22px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --surface-0:#0a0a0a; --surface-1:#151516; --surface-2:#1f1f21; --surface-3:#2a2a2d;
  --line:#242427; --line-soft:#1b1b1d;
  --text-primary:#f2f2f2; --text-secondary:#a3a3a3; --text-tertiary:#6b6b6b;
  --accent-strong:#ffd100; --accent-soft:#26220a; --accent-line:#ffd100;
  --positive:#22c55e; --positive-soft:#123021; --negative:#ef4444; --negative-soft:#331717;
  --warning:#f59e0b; --warning-soft:#2a1f08;
  --ink-line:#f2f2f2; --yellow-line:#ffd100; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lift:0 6px 22px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.85em}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 80px}

.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface-1) 92%,transparent);backdrop-filter:saturate(1.1) blur(8px);border-bottom:1px solid var(--line)}
.appbar .top{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;height:52px;padding:0 22px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:-.02em;font-size:15px}
.brand .sq{width:19px;height:19px;background:var(--ps-yellow);border-radius:4px;position:relative;flex:none}
.brand .sq::after{content:"";position:absolute;inset:5px 5px auto auto;width:6px;height:6px;border-right:2px solid #000;border-top:2px solid #000}
.brand small{font-weight:600;color:var(--text-tertiary);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.stamp{font-size:11.5px;color:var(--text-tertiary);text-align:right;line-height:1.35}
.stamp b{color:var(--text-secondary);font-weight:600}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-1);color:var(--text-secondary);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .12s}
.iconbtn:hover{background:var(--surface-2)}
.pdfbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-1);color:var(--text-secondary);cursor:pointer;font:inherit;font-size:12.5px;font-weight:650;white-space:nowrap;transition:background .12s,color .12s}
.pdfbtn:hover{background:var(--surface-2);color:var(--text-primary)}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 14px;overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:11px 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--text-secondary);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;margin-bottom:-1px;transition:color .12s}
.tab:hover{color:var(--text-primary)}
.tab[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--ps-yellow);font-weight:650}
.tab:focus-visible{outline:2px solid var(--accent-strong);outline-offset:-3px;border-radius:4px}
.tab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--positive)} .dot.warn{background:var(--warning)} .dot.bad{background:var(--negative)} .dot.off{background:var(--neutral)}
.tab.settings-tab{margin-left:auto;color:var(--text-tertiary)}

.titleband{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:24px 0 4px}
h1{margin:0;font-size:26px;font-weight:720;letter-spacing:-.03em}
.subid{margin-top:6px;color:var(--text-tertiary);font-size:12px}
.chips{display:inline-flex;gap:6px;margin-left:4px;vertical-align:middle}
.chip{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--text-secondary);background:var(--surface-1)}
.chip.src{color:var(--accent-strong);border-color:color-mix(in srgb,var(--ps-yellow) 55%,var(--line));background:var(--accent-soft)}
.wtag{font-size:11.5px;color:var(--text-tertiary);text-align:right}
.wtag b{color:var(--text-secondary);font-weight:650}

.verdict{display:flex;gap:13px;align-items:flex-start;margin-top:16px;padding:16px 20px;border-radius:12px;background:var(--surface-1);border:1px solid var(--line);box-shadow:var(--shadow);border-left:4px solid var(--neutral)}
.verdict.good{border-left-color:var(--positive)} .verdict.warn{border-left-color:var(--warning)} .verdict.bad{border-left-color:var(--negative)}
.verdict .tag{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-tertiary);padding-top:3px;flex:none}
.verdict.good .tag{color:var(--positive)} .verdict.warn .tag{color:var(--warning)} .verdict.bad .tag{color:var(--negative)}
.verdict p{margin:0;font-size:15.5px;line-height:1.55}
.verdict b{font-weight:700}
.verdict .aside{color:var(--text-tertiary)}

section{margin-top:28px}
.shead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.shead h2{margin:0;font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--text-secondary)}
.shead .hint{font-size:11.5px;color:var(--text-tertiary)}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.col h3{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.col.win h3{color:var(--positive)} .col.prob h3{color:var(--negative)}
.col h3 .n{font-size:10px;font-weight:700;color:var(--text-tertiary);background:var(--surface-2);border-radius:20px;padding:2px 8px}
.ins{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;transition:box-shadow .14s,border-color .14s,transform .14s}
.ins:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.ins.w{border-left:3px solid var(--positive)} .ins.p{border-left:3px solid var(--negative)} .ins.pm{border-left:3px solid var(--warning)}
.ins .it{font-weight:700;font-size:13.5px;line-height:1.35}
.ins .ib{color:var(--text-secondary);font-size:12.5px;margin-top:5px;line-height:1.5}
.ins .fix{margin-top:9px;font-size:12.5px;line-height:1.45;padding-top:9px;border-top:1px dashed var(--line)}
.ins .fix b{color:var(--accent-strong);font-weight:750}
.ins .src{font-size:10px;color:var(--text-tertiary);margin-top:8px;font-family:var(--mono)}
.metric{font-weight:750;font-variant-numeric:tabular-nums}

/* funnel + kpis */
.duo{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:stretch}
@media(max-width:820px){.duo{grid-template-columns:1fr}}
.funnelcard{padding:18px;display:flex;flex-direction:column}
.funnelcard .cap{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-tertiary)}
.funnel{margin-top:16px;display:flex;flex-direction:column;gap:6px;flex:1;justify-content:center}
.frow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.fbar{height:46px;border-radius:7px;display:flex;flex-direction:column;justify-content:center;padding-left:14px;color:#000;transition:filter .14s}
.fbar:hover{filter:brightness(1.05)}
.fbar .fn{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.62}
.fbar .fv{font-size:18px;font-weight:770;letter-spacing:-.02em;line-height:1}
.fside{text-align:right;min-width:58px}
.fside .fp{font-size:15px;font-weight:750}
.fside .fpl{font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em}
.funnelcard .fnote{margin-top:14px;font-size:11px;color:var(--text-tertiary);line-height:1.5}
.pend{margin-top:16px;display:flex;flex-direction:column;flex:1;justify-content:center}
.pendrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.pendrow:last-child{border-bottom:0}
.pendrow .pk{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)}
.pendrow .pv{font-size:13px;font-weight:650;text-align:right}

.kpis{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.kpis.two{grid-template-columns:repeat(2,1fr)}
.kpis.wide{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.kpis.wide{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kpis.two,.kpis.wide{grid-template-columns:1fr}}
.kpi{background:var(--surface-1);padding:15px 16px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:96px;transition:background .12s}
.kpi:hover{background:var(--surface-2)}
.kpi .kl{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary)}
.kpi .kv{font-size:24px;font-weight:730;letter-spacing:-.03em;line-height:1}
.kpi .krow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.g{color:var(--positive);background:var(--positive-soft)} .pill.b{color:var(--negative);background:var(--negative-soft)} .pill.n{color:var(--text-tertiary);background:var(--surface-2)}
.kpi .ksub{font-size:11px;color:var(--text-tertiary)}
.kpi .lowvol{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--warning);cursor:help}
.kpi .lowvol .q{width:13px;height:13px;border-radius:50%;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:8px}

/* charts */
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.charts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.charts{grid-template-columns:1fr}}
.chart{padding:15px 16px 12px;transition:box-shadow .14s,border-color .14s}
.chart:hover{box-shadow:var(--shadow-lift);border-color:var(--surface-3)}
.chart .ct{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chart .cname{font-size:12.5px;font-weight:750}
.chart .cunit{font-size:10.5px;color:var(--text-tertiary);font-weight:500;margin-left:5px}
.chart .cd{font-size:11.5px;font-weight:700}
.chart .cnow{font-size:19px;font-weight:730;letter-spacing:-.03em;margin:6px 0 0}
.chart .clown{font-size:9.5px;font-weight:700;color:var(--warning);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.plot{position:relative;margin-top:6px}
.plot svg{display:block;width:100%;height:122px;cursor:crosshair}
.tt{position:absolute;transform:translate(-50%,-100%);background:var(--surface-1);border:1px solid var(--surface-3);border-radius:7px;box-shadow:var(--shadow-lift);padding:5px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;pointer-events:none;z-index:5;margin-top:-6px}
.tt b{font-weight:750}
.tt .tv{font-variant-numeric:tabular-nums}
.up{color:var(--positive)} .down{color:var(--negative)} .flat{color:var(--text-tertiary)}

/* week over week — aligned columns */
.tscroll{overflow-x:auto;border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-1)}
th:first-child,td:first-child{text-align:left}
td{padding:12px 16px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td:not(:first-child){text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.period{font-weight:700}
.cell{display:inline-grid;grid-template-columns:auto 52px;gap:9px;align-items:baseline}
.cell .v{text-align:right;font-variant-numeric:tabular-nums}
.cell .p{text-align:left}
.cell .p .pill{padding:1px 5px}
/* align WoW headers over the numbers, not out past the change pills */
table.wow thead th:not(:first-child){padding-right:77px}
@media(max-width:640px){table.wow thead th:not(:first-child){padding-right:61px}}

.creat{display:flex;flex-direction:column;gap:2px;text-align:left}
.creat .cn{font-family:var(--mono);font-size:12px;color:var(--text-primary)}
.creat .cm{font-size:10.5px;color:var(--text-tertiary)}
.tag2{font-size:10px;font-weight:750;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--text-secondary);white-space:nowrap}
.tag2.good{color:var(--positive);border-color:color-mix(in srgb,var(--positive) 35%,var(--line));background:var(--positive-soft)}
.tag2.work{color:var(--accent-strong);border-color:color-mix(in srgb,var(--ps-yellow) 45%,var(--line));background:var(--accent-soft)}
.tag2.watch{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 35%,var(--line));background:var(--warning-soft)}
.tag2.paused{opacity:.7}
.cwrap{min-width:680px}

/* settings */
.setnote{font-size:12.5px;color:var(--text-secondary);margin:2px 0 16px;max-width:80ch;line-height:1.5}
.setgrid{overflow-x:auto}
.setgrid table{min-width:820px}
.setgrid th,.setgrid td{padding:13px 16px}
.toggle{position:relative;display:inline-block;width:38px;height:22px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--surface-3);border-radius:22px;cursor:pointer;transition:.15s}
.slider::before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle input:checked + .slider{background:var(--positive)}
.toggle input:checked + .slider::before{transform:translateX(16px)}
.fld{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--text-primary);font-family:var(--mono);font-size:11.5px;padding:6px 8px;width:100%;min-width:150px}
.fld:focus{outline:2px solid var(--accent-strong);outline-offset:-1px}
.fld.warn{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,var(--line))}
.setgrid td{text-align:left;vertical-align:middle}
.pausedrow td{opacity:.5}

.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--text-tertiary)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.panel:not([hidden]){animation:fade .16s ease-out}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* password gate removed — report is open, no login required */

/* ================= PRINT / SAVE-AS-PDF ================= */
/* Clean white paper. Every client prints in full, each starting on its own page. */
@media print{
  :root,:root[data-theme="dark"],:root[data-theme="light"]{
    --surface-0:#ffffff; --surface-1:#ffffff; --surface-2:#f3f4f6; --surface-3:#e5e7eb;
    --line:#d4d7dc; --line-soft:#e6e8ec;
    --text-primary:#141417; --text-secondary:#3f3f46; --text-tertiary:#65707c;
    --accent-strong:#a97e00; --accent-soft:#fff7d6; --accent-line:#e6b400;
    --positive:#15803d; --positive-soft:#e6f4ec; --negative:#b91c1c; --negative-soft:#fbe9e9;
    --warning:#b45309; --warning-soft:#fbf0dc; --neutral:#8a8f98;
    --ink-line:#141417; --yellow-line:#b8940a; --shadow:none; --shadow-lift:none;
  }
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  @page{size:portrait;margin:11mm 11mm 13mm}
  html,body{background:#fff !important}
  body{font-size:10.5px;line-height:1.4}
  /* drop the interactive chrome */
  #gate,.appbar,.tabs,.tab,#pdfbtn,#theme,.iconbtn,.tt{display:none !important}
  #app{display:block !important}
  #p-settings{display:none !important}
  .wrap{max-width:none;margin:0;padding:0}
  /* one client per page; never split a client across the page start */
  .panel{display:block !important;break-before:page;page-break-before:always}
  #panels>.panel:first-child{break-before:auto;page-break-before:avoid}
  .panel[hidden]{display:block !important}
  /* keep small blocks whole across page breaks */
  .verdict,.ins,.kpi,.chart,.funnelcard,.frow,.pendrow,tr,thead{break-inside:avoid;page-break-inside:avoid}
  .shead,h1,.titleband{break-after:avoid;page-break-after:avoid}
  section{margin-top:16px}
  /* wide tables (week-over-week, top creatives) must FIT the page, never scroll off */
  .tscroll{overflow:visible !important}
  .cwrap,.setgrid table{min-width:0 !important}
  table{font-size:9px !important;table-layout:auto;width:100% !important}
  th,td{padding:6px 7px !important}
  /* week-over-week: tighten the change-pill column + gaps so all 7 columns fit */
  table.wow thead th:not(:first-child){padding-right:8px !important}
  .wow .cell{grid-template-columns:auto 34px !important;gap:4px !important}
  .wow .cell .v{font-size:9px}
  .wow .cell .p .pill{padding:1px 3px !important;font-size:8.5px !important}
  /* top creatives: let long ad names + tag labels wrap instead of forcing extra width */
  .creat .cn{white-space:normal !important;word-break:break-word;font-size:9px}
  .cwrap td:first-child,.cwrap th:first-child{white-space:normal !important;max-width:150px}
  .tag2{white-space:normal !important;font-size:8.5px}
  /* neutralise hover/animation and screen shadows */
  .panel:not([hidden]){animation:none !important}
  .card,.ins,.kpis,.chart{box-shadow:none !important}
  .ins:hover,.chart:hover,.kpi:hover,.fbar:hover{transform:none !important;box-shadow:none !important;filter:none !important}
  /* charts a touch shorter for paper */
  .plot svg{height:104px !important}
  .charts{gap:10px}
}
</style>

<div id="app">
<div class="appbar">
  <div class="top">
    <div class="brand"><span class="sq"></span>Posted Social <small>· Monday Ads Review</small></div>
    <div class="spacer"></div>
    <div class="stamp">ran <b>__RAN__</b><br>reporting week <b>__WEEK__</b></div>
    <button class="pdfbtn" id="pdfbtn" title="Save the whole report as PDF — every client, each on its own page">↓ Save PDF</button>
    <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</div>

<div class="wrap" id="panels"></div>
</div><!-- /#app -->

<script>
const F={
  money0:v=>v==null?'—':'$'+Math.round(v).toLocaleString(),
  money2:v=>v==null?'—':'$'+v.toFixed(2),
  int:v=>v==null?'—':Math.round(v).toLocaleString(),
  pct2:v=>v==null?'—':v.toFixed(2)+'%',
  dec2:v=>v==null?'—':v.toFixed(2)
};

const CLIENTS=__CLIENTS_DATA__;
var WK='__WEEK__';

function pillHTML(d,dir){
  if(d==null) return '';
  if(d===0) return '<span class="pill n">0%</span>';
  var up=d>0,ar=up?'↑':'↓',good=dir==='up'?up:!up,cls=dir==='neutral'?'n':(good?'g':'b');
  return '<span class="pill '+cls+'">'+ar+Math.abs(d)+'%</span>';
}
function frow(name,val,w,color,pct,pl,dark){
  return '<div class="frow"><div class="fbar" style="width:'+w+'%;background:'+color+'">'+
    '<span class="fn"'+(dark?' style="color:#fff;opacity:.75"':'')+'>'+name+'</span>'+
    '<span class="fv num"'+(dark?' style="color:#fff"':'')+'>'+val+'</span></div>'+
    '<div class="fside"><div class="fp num">'+pct+'</div><div class="fpl">'+pl+'</div></div></div>';
}
function taperFunnel(f){
  return '<div class="card funnelcard"><div class="cap">Lead → sale funnel</div><div class="funnel">'+
    frow('Cohort leads',f.leads,100,'#ffd100','','')+
    frow('Booked',f.booked,74,'#f0be00',f.bp,'of leads')+
    frow('Showed',f.showed,50,'#dca800',f.sp,'of booked')+
    frow('Sold',f.sold,32,'#b98600',f.cp,'of showed',true)+
    '</div><div class="fnote">'+f.note+'</div></div>';
}
function pendingFunnel(f){
  return '<div class="card funnelcard"><div class="cap">Lead → sale pipeline</div><div class="pend">'+
    '<div class="pendrow"><span class="pk">Pipeline</span><span class="pv mono">'+f.pipeline+'</span></div>'+
    '<div class="pendrow"><span class="pk">Stages</span><span class="pv">'+f.stages+'</span></div>'+
    '<div class="pendrow"><span class="pk">In flight</span><span class="pv">'+f.flight+'</span></div>'+
    '</div><div class="fnote">'+f.note+'</div></div>';
}
function kpiCard(k,leadsWk){
  var h='<div class="kpi"><div class="kl">'+k.l+'</div><div class="kv num">'+F[k.fmt](k.v)+'</div>';
  if(k.prior===null||k.prior===undefined){
    h+='<div class="krow"><span class="pill n">new</span><span class="ksub">since launch</span></div>';
  } else if(k.lowvol){
    var msg='Only '+leadsWk+' lead'+(leadsWk===1?'':'s')+' last week — a swing on so few isn’t a real trend, so it’s not colored. Judge this on the 30-day view.';
    h+='<div class="krow"><span class="pill n num">'+(k.d>0?'↑':k.d<0?'↓':'')+Math.abs(k.d)+'%</span>'+
       '<span class="lowvol" title="'+msg+'"><span class="q">?</span>low volume</span></div>';
  } else {
    h+='<div class="krow">'+pillHTML(k.d,k.dir)+'<span class="ksub num">vs '+F[k.fmt](k.prior)+'</span></div>';
  }
  return h+'</div>';
}

function panelHTML(c){
  var ads=c.type==='ads';
  var h='<div class="panel" id="p-'+c.id+'" role="tabpanel" hidden>';
  h+='<div class="titleband"><div><h1>'+c.name+' <span class="chips">'+c.chips.map(function(x){return '<span class="chip '+x[0]+'">'+x[1]+'</span>';}).join('')+'</span></h1>'+
     '<div class="subid mono">'+c.sub+'</div></div>'+
     '<div class="wtag">showing <b>last week</b> · '+WK+'<br>trends show the last 4 weeks</div></div>';
  h+='<div class="verdict '+c.verdict.tone+'"><span class="tag">Take</span><p>'+c.verdict.html+'</p></div>';
  // analysis
  h+='<section><div class="shead"><h2>What the data says</h2><span class="hint">'+(ads?'Meta delivery signals — this client has no CRM pipeline':'Meta delivery joined to GHL outcomes')+'</span></div><div class="split">';
  h+='<div class="col win"><h3>Working well <span class="n">'+c.wins.length+'</span></h3>'+c.wins.map(function(w){return '<div class="ins w"><div class="it">'+w.t+'</div><div class="ib">'+w.b+'</div><div class="src">'+w.s+'</div></div>';}).join('')+'</div>';
  h+='<div class="col prob"><h3>Needs attention <span class="n">'+c.problems.length+'</span></h3>'+c.problems.map(function(p){return '<div class="ins '+(p.tone||'p')+'"><div class="it">'+p.t+'</div><div class="ib">'+p.b+'</div><div class="fix"><b>Fix:</b> '+p.fix+'</div><div class="src">'+p.s+'</div></div>';}).join('')+'</div>';
  h+='</div></section>';
  // numbers (+ funnel for pipeline)
  if(!ads){
    var fhint=c.funnel.pending?'GHL pipeline connected · funnel populates on the live run · the six numbers are last week vs the week before':'funnel = matured cohort (real) · the six numbers are last week vs the week before';
    h+='<section><div class="shead"><h2>Funnel &amp; last-week numbers</h2><span class="hint">'+fhint+'</span></div><div class="duo">';
    h+=c.funnel.pending?pendingFunnel(c.funnel):taperFunnel(c.funnel);
    h+='<div class="kpis two">'+c.kpis.map(function(k){return kpiCard(k,c.leadsWk);}).join('')+'</div></div></section>';
  } else {
    var nh=c.newCampaign?'<h2>Since launch</h2><span class="hint">first days of delivery · no prior period yet</span>':'<h2>Last-week numbers</h2><span class="hint">last week vs the week before · ads-only — no pipeline connected</span>';
    h+='<section><div class="shead">'+nh+'</div><div class="kpis wide">'+c.kpis.map(function(k){return kpiCard(k,c.leadsWk);}).join('')+'</div></section>';
  }
  // charts + week over week (only when there's history)
  if(c.newCampaign){
    h+='<section><div class="shead"><h2>Trend</h2><span class="hint">not enough history yet</span></div><div class="card" style="padding:18px 20px;font-size:13.5px;color:var(--text-secondary);line-height:1.6">'+c.launchNote+'</div></section>';
  } else {
  h+='<section><div class="shead"><h2>4-week trend</h2><span class="hint">one point per completed week · hover for exact values · y-axis starts at zero</span></div><div class="charts" data-charts="'+c.id+'"></div></section>';
  // wow
  h+='<section><div class="shead"><h2>Week over week</h2><span class="hint">only the change is colored, never the raw value · cost metrics: down is good</span></div><div class="card tscroll"><table class="wow"><thead><tr><th>Week</th>'+c.wow.cols.map(function(x){return '<th>'+x[0]+'</th>';}).join('')+'</tr></thead><tbody>'+
    c.wow.rows.map(function(r){return '<tr><td class="period">'+r.w+'</td>'+r.c.map(function(cell,ci){return '<td><span class="cell"><span class="v num">'+cell[0]+'</span><span class="p">'+pillHTML(cell[1],c.wow.cols[ci][1])+'</span></span></td>';}).join('')+'</tr>';}).join('')+
    '</tbody></table></div></section>';
  }
  // creatives
  h+='<section><div class="shead"><h2>Top creatives</h2><span class="hint">'+(ads?'Meta metrics · last 30 days · top by spend':'Meta spend joined to GHL outcomes on utmAdId · last 30 days')+'</span></div><div class="card tscroll"><table class="cwrap"><thead><tr>'+c.creatives.cols.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+
    c.creatives.rows.map(function(r){return '<tr><td><span class="creat"><span class="cn">'+r.name+'</span><span class="cm">'+r.meta+'</span></span></td>'+r.c.map(function(v){return '<td class="num">'+v+'</td>';}).join('')+'<td>'+(r.tag&&r.tag[1]?'<span class="tag2 '+r.tag[0]+'">'+r.tag[1]+'</span>':'')+'</td></tr>';}).join('')+
    '</tbody></table></div></section>';
  h+='</div>';
  return h;
}

function niceMax(a){var v=a.filter(function(x){return x!=null;});var mx=Math.max.apply(null,v);if(mx<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(mx)));var f=mx/p;var n=f<=1?1:f<=1.5?1.5:f<=2?2:f<=3?3:f<=5?5:10;return n*p*1.15;}
function renderCharts(c){
  var wrap=document.querySelector('[data-charts="'+c.id+'"]'); if(!wrap) return; wrap.innerHTML='';
  var cs=getComputedStyle(document.documentElement);
  var yellow=cs.getPropertyValue('--yellow-line').trim(),ink=cs.getPropertyValue('--ink-line').trim(),grid=cs.getPropertyValue('--line').trim(),tert=cs.getPropertyValue('--text-tertiary').trim(),font=cs.getPropertyValue('--sans');
  c.trends.forEach(function(m){
    var W=320,H=122,padL=8,padR=10,padT=20,padB=20,iW=W-padL-padR,iH=H-padT-padB;
    var ymax=niceMax(m.data),n=m.data.length,stroke=m.color==='y'?yellow:ink,muted=m.lown;
    function X(i){return padL+iW*(i/(n-1));}
    function Xb(i){return padL+iW*((i+0.5)/n);}
    function Y(v){return padT+iH*(1-v/ymax);}
    var op=muted?'0.5':'1';
    var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+m.name+'">';
    svg+='<line x1="'+padL+'" y1="'+Y(ymax)+'" x2="'+(W-padR)+'" y2="'+Y(ymax)+'" stroke="'+grid+'" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    svg+='<line x1="'+padL+'" y1="'+Y(0)+'" x2="'+(W-padR)+'" y2="'+Y(0)+'" stroke="'+grid+'" stroke-width="1.4" vector-effect="non-scaling-stroke"/>';
    svg+='<line class="guide" x1="0" y1="'+padT+'" x2="0" y2="'+Y(0)+'" stroke="'+tert+'" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" style="display:none"/>';
    if(m.type==='bar'){
      var bw=iW/n*0.5;
      m.data.forEach(function(v,i){ if(v==null)return; var x=Xb(i),y=Y(v);
        svg+='<rect x="'+(x-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+(Y(0)-y)+'" rx="3" fill="'+stroke+'" opacity="'+(i===n-1?op:(muted?'0.3':'0.42'))+'"/>';
        svg+='<text x="'+x+'" y="'+(y-6)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+(i===n-1&&!muted?stroke:tert)+'" font-family="'+font+'">'+F[m.fmt](v)+'</text>';});
    } else {
      var dq=[];m.data.forEach(function(v,i){ if(v==null)return; dq.push(X(i)+','+Y(v)); });
      var pts=dq.join(' ');
      if(m.color==='y'&&!muted){var fi=m.data.findIndex(function(x){return x!=null;});var area='M'+X(fi)+','+Y(0)+' L'+pts.split(' ').join(' L')+' L'+X(n-1)+','+Y(0)+' Z';svg+='<path d="'+area+'" fill="'+stroke+'" opacity="0.09"/>';}
      svg+='<polyline points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="'+op+'"'+(muted?' stroke-dasharray="4 3"':'')+'/>';
      m.data.forEach(function(v,i){ if(v==null)return; svg+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(i===n-1?3.4:2.4)+'" fill="'+stroke+'" opacity="'+op+'"/>';
        svg+='<text x="'+X(i)+'" y="'+(Y(v)-7)+'" text-anchor="'+(i===0?'start':i===n-1?'end':'middle')+'" font-size="10.5" font-weight="700" fill="'+(i===n-1&&!muted?stroke:tert)+'" font-family="'+font+'">'+F[m.fmt](v)+'</text>';});
    }
    svg+='<circle class="gdot" r="4" fill="'+stroke+'" stroke="var(--surface-1)" stroke-width="1.5" style="display:none"/>';
    c.weeks.forEach(function(l,i){var x=m.type==='bar'?Xb(i):X(i);var an=i===0?'start':i===n-1?'end':'middle';var xx=i===0?2:i===n-1?(W-2):x;svg+='<text x="'+xx+'" y="'+(H-6)+'" text-anchor="'+an+'" font-size="9.5" fill="'+tert+'" font-family="'+font+'">'+l+'</text>';});
    svg+='</svg>';
    var d=deltaHTML(m.d,m.dir,m.lown);
    var lastv=null;for(var k=m.data.length-1;k>=0;k--){if(m.data[k]!=null){lastv=m.data[k];break;}}
    var el=document.createElement('div');el.className='card chart';
    el.innerHTML='<div class="ct"><span><span class="cname">'+m.name+'</span><span class="cunit">'+m.unit+'</span></span><span class="cd">'+d+'</span></div>'+
      '<div class="cnow num">'+F[m.fmt](lastv)+'</div>'+(m.lown?'<div class="clown">low volume — not a reliable trend</div>':'')+
      '<div class="plot">'+svg+'<div class="tt" hidden></div></div>';
    wrap.appendChild(el);
    // hover
    (function(){
      var plot=el.querySelector('.plot'),tt=el.querySelector('.tt'),guide=el.querySelector('.guide'),gdot=el.querySelector('.gdot');
      function pos(i){return m.type==='bar'?Xb(i):X(i);}
      plot.addEventListener('mousemove',function(e){
        var r=plot.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width;
        var i=m.type==='bar'?Math.floor(fx*n):Math.round(fx*(n-1)); i=Math.max(0,Math.min(n-1,i));
        if(m.data[i]==null){tt.hidden=true;guide.style.display='none';gdot.style.display='none';return;}
        var vx=pos(i),vy=Y(m.data[i]);
        guide.setAttribute('x1',vx);guide.setAttribute('x2',vx);guide.style.display='';
        gdot.setAttribute('cx',vx);gdot.setAttribute('cy',vy);gdot.style.display='';
        tt.innerHTML='<b>'+c.weeks[i]+'</b> · <span class="tv">'+F[m.fmt](m.data[i])+'</span>';
        tt.style.left=(vx/W*100)+'%';tt.style.top=vy+'px';tt.hidden=false;
      });
      plot.addEventListener('mouseleave',function(){tt.hidden=true;guide.style.display='none';gdot.style.display='none';});
    })();
  });
}
function deltaHTML(sign,dir,lown){
  if(sign==null) return '';
  var up=sign>0,arrow=up?'↑':'↓',mag=Math.abs(sign).toFixed(1)+'%';
  if(lown) return '<span class="flat num" style="font-weight:600">'+arrow+' '+mag+'</span>';
  if(dir==='neutral') return '<span class="flat num">'+arrow+' '+mag+'</span>';
  var good=dir==='up'?up:!up;
  return '<span class="num '+(good?'up':'down')+'">'+arrow+' '+mag+'</span>';
}

var tabsEl=document.getElementById('tabs'), panelsEl=document.getElementById('panels');
CLIENTS.forEach(function(c){
  var t=document.createElement('button');t.className='tab';t.setAttribute('role','tab');t.id='t-'+c.id;t.setAttribute('aria-controls','p-'+c.id);
  t.innerHTML='<span class="dot '+c.dot+'"></span>'+c.name;
  t.addEventListener('click',function(){show(c.id);});
  tabsEl.appendChild(t);
  try{ panelsEl.insertAdjacentHTML('beforeend',panelHTML(c)); }
  catch(err){ panelsEl.insertAdjacentHTML('beforeend','<div class="panel" id="p-'+c.id+'" role="tabpanel" hidden><div class="titleband"><div><h1>'+c.name+'</h1><div class="subid mono">'+(c.sub||'')+'</div></div></div><div class="verdict bad"><span class="tag">Render error</span><p>This client hit a render error and was skipped so the rest of the report still loads.</p></div></div>'); console.error('panel render failed for '+c.id, err); }
});
var st=document.createElement('button');st.className='tab settings-tab';st.setAttribute('role','tab');st.id='t-settings';st.setAttribute('aria-controls','p-settings');st.textContent='⚙ Settings';
st.addEventListener('click',function(){show('settings');});
tabsEl.appendChild(st);
panelsEl.insertAdjacentHTML('beforeend',settingsHTML());

function settingsHTML(){
  var rows=CLIENTS.map(function(c){
    var ghl=c.type==='pipeline';
    return '<tr'+(c.status==='paused'?' class="pausedrow"':'')+'>'+
      '<td style="font-weight:650">'+c.name+'</td>'+
      '<td><label class="toggle"><input type="checkbox"'+(c.status==='active'?' checked':'')+' aria-label="'+c.name+' active"><span class="slider"></span></label></td>'+
      '<td><input class="fld" value="'+c.act+'"></td>'+
      '<td><label class="toggle"><input type="checkbox"'+(ghl?' checked':'')+' aria-label="'+c.name+' has GHL"><span class="slider"></span></label></td>'+
      '<td><input class="fld'+(ghl?'':' warn')+'" value="'+(ghl?c.ghlLoc:'— none —')+'"></td>'+
      '<td><input class="fld'+(ghl?'':' warn')+'" value="'+(ghl?c.ghlPipe:'— ads only —')+'"></td>'+
    '</tr>';
  }).join('');
  return '<div class="panel" id="p-settings" role="tabpanel" hidden>'+
    '<div class="titleband"><div><h1>Settings</h1><div class="subid">What the Monday run reads before it does anything else</div></div></div>'+
    '<p class="setnote">One row per client. Toggle <b>Active</b> to include a client in the run (off = paused &amp; skipped). Toggle <b>GHL pipeline</b> on for clients with a CRM — those get the full funnel and cost-per-sold; clients with it off render the <b>ads-only</b> layout automatically, no empty pipeline sections. The pipeline + location fields only matter when GHL is on. Saved as <span class="mono">clients.json</span> next to the scheduled task.</p>'+
    '<div class="card setgrid"><table><thead><tr><th>Client</th><th>Active</th><th>Meta ad account</th><th>GHL pipeline</th><th>GHL location</th><th>Pipeline</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<section><div class="shead"><h2>Run</h2></div><div class="kpis wide" style="grid-template-columns:repeat(4,1fr)">'+
      '<div class="kpi"><div class="kl">Schedule</div><div class="kv" style="font-size:18px">Mon 5:00 AM</div><div class="ksub">America/Chicago</div></div>'+
      '<div class="kpi"><div class="kl">Reporting week</div><div class="kv" style="font-size:18px">Mon – Sun</div><div class="ksub">closed weeks only</div></div>'+
      '<div class="kpi"><div class="kl">Delivery</div><div class="kv" style="font-size:18px">#ad-reports</div><div class="ksub">via Slack connector</div></div>'+
      '<div class="kpi"><div class="kl">Runs on</div><div class="kv" style="font-size:18px">Cloud</div><div class="ksub">laptop-independent</div></div>'+
    '</div></section>'+
    '<div class="foot"><span>Posted Social · internal ads review · not client-facing</span><span>Live from Meta Ads API + GoHighLevel · USD</span></div>'+
    '</div>';
}

function show(id){
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',String(t.id==='t-'+id));});
  document.querySelectorAll('.panel').forEach(function(p){p.hidden=(p.id!=='p-'+id);});
  var tabsC=document.getElementById('tabs'),at=document.getElementById('t-'+id);
  if(tabsC&&at){try{tabsC.scrollTo({left:at.offsetLeft-tabsC.clientWidth/2+at.clientWidth/2,behavior:'smooth'});}catch(e){}}
  window.scrollTo({top:0});
}
document.getElementById('theme').addEventListener('click',function(){var r=document.documentElement,cur=r.getAttribute('data-theme');r.setAttribute('data-theme',cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark'));setTimeout(function(){CLIENTS.forEach(renderCharts);},20);});

// Save-as-PDF: reveal every client (each on its own page), force a light palette so
// chart lines aren't white-on-white, then restore the on-screen view afterward.
(function(){
  var btn=document.getElementById('pdfbtn');
  if(btn) btn.addEventListener('click',function(){window.print();});
  var prevTheme=null;
  window.addEventListener('beforeprint',function(){
    var r=document.documentElement; prevTheme=r.getAttribute('data-theme');
    r.setAttribute('data-theme','light');
    document.querySelectorAll('.panel').forEach(function(p){p.removeAttribute('hidden');});
    CLIENTS.forEach(renderCharts);
  });
  window.addEventListener('afterprint',function(){
    var r=document.documentElement;
    if(prevTheme===null) r.removeAttribute('data-theme'); else r.setAttribute('data-theme',prevTheme);
    var sel=document.querySelector('.tab[aria-selected="true"]'), id=sel?sel.id.slice(2):'stlsc';
    document.querySelectorAll('.panel').forEach(function(p){p.hidden=(p.id!=='p-'+id);});
    CLIENTS.forEach(renderCharts);
  });
})();

CLIENTS.forEach(function(c){try{renderCharts(c);}catch(err){console.error('chart render failed for '+c.id, err);}});
show('stlsc');

// Chart colors are baked from the computed palette at render time. Inside the
// claude.ai artifact frame the host applies the viewer's theme AFTER this script
// runs, so re-render whenever the theme flips — otherwise dark-mode "ink" charts
// (Leads bars, CTR, Frequency) get baked near-black and vanish on the dark bg.
(function(){
  function rerender(){ CLIENTS.forEach(function(c){try{renderCharts(c);}catch(e){}}); }
  try{ new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','style']}); }catch(e){}
  try{ var mq=matchMedia('(prefers-color-scheme:dark)'); if(mq.addEventListener)mq.addEventListener('change',rerender); else if(mq.addListener)mq.addListener(rerender); }catch(e){}
  setTimeout(rerender,300);
})();
